[options]
isa rv32ec
nret 1
nbus 1
buslen 32
solver z3

[depth]
fault_ch0 12
bus_dmem_fault_ch0 1 12
bus_imem_fault_ch0 1 12
bus_dmem_io_read_fault_ch0 1 12
bus_dmem_io_write_fault_ch0 1 12

[csrs]
mcause

[defines]
`define YOSYS
`define RISCV_FORMAL_ALIGNED_MEM
`define RISCV_FORMAL_VALIDADDR(addr) 1'b1
`define RISCV_FORMAL_IOADDR(addr) addr[31]
`define RISCV_FORMAL_MEM_FAULT
`define DITDAH_E1_RVFI_CSR_TRACE

[script-defines]
plugin -i @SLANG_SO@
read_slang -I@basedir@/cores/@core@ @basedir@/cores/@core@/ditdah_e1_trace_top.sv @basedir@/cores/@core@/DitDahE1.sv @basedir@/cores/@core@/DitDahE1Gpr.sv @basedir@/cores/@core@/DitDahE1_DV.sv @basedir@/cores/@core@/layers-DitDahE1-DV.sv --top ditdah_e1_trace_top

[verilog-files]
@basedir@/cores/@core@/wrapper.sv
